# configs/anomaly_detection.yaml
# Central configuration for the Model 3 energy anomaly detection pipeline.
# Scripts read this file so all versions share the same source of truth.

buildings:
  - Robin_education_Kiera
  - Robin_lodging_Pricilla
  - Robin_office_Maryann
  - Robin_office_Serena
  - Robin_education_Derrick

paths:
  raw_data: data/raw/bdg2/meters/cleaned/electricity_cleaned.csv
  selected: data/processed/anomaly/selected_buildings.csv
  features_v1: data/processed/anomaly/anomaly_features.csv
  features_v2: data/processed/anomaly/anomaly_features_v2.csv
  predictions_v1: data/processed/anomaly/anomaly_predictions.csv
  predictions_v2: data/processed/anomaly/anomaly_predictions_v2.csv
  predictions_v3: data/processed/anomaly/anomaly_predictions_v3.csv
  report_v3: data/processed/anomaly/anomaly_report_v3.json
  models_dir: artifacts/models/anomaly

isolation_forest:
  n_estimators: 200
  contamination: 0.02
  max_samples: auto
  random_state: 42
  n_jobs: 1

training:
  train_fraction: 0.80

zscore:
  threshold: 3.5

feature_columns:
  - consumption
  - hour_sin
  - hour_cos
  - day_sin
  - day_cos
  - is_weekend
  - rolling_mean_24h
  - rolling_std_24h
  - rolling_median_24h
  - deviation_24h
  - median_deviation_24h

rolling_windows:
  window_hours: 24
  min_periods: 24

interpolation:
  method: linear
  limit: 2
  limit_area: inside
